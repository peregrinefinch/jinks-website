# SPDX-License-Identifier: Apache-2.0
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
      - uses: actions/configure-pages@v6
        id: pages
      - name: Check and build
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/peregrinefinch/jinks/releases/download/v1.0.0/jinks \
            --output "$RUNNER_TEMP/jinks"
          printf '%s  %s\n' 9a3ce4916430f44c76e9e4019a8d8ca5326a233c87cc75801e8afd50669d436d "$RUNNER_TEMP/jinks" | sha256sum --check
          escript "$RUNNER_TEMP/jinks" check --environment production --base-url "$PAGES_URL"
          escript "$RUNNER_TEMP/jinks" build --environment production --base-url "$PAGES_URL"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
